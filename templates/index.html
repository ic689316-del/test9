<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>냉장고 재료 인식</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
  #ingredients { list-style: none; padding: 0; }
  #ingredients li { display: flex; gap: 8px; margin: 6px 0; }
  #ingredients input { flex: 1; }
  #status { color: #666; margin-top: 12px; }
  #error { color: #c0392b; margin-top: 12px; }
  .recipe-card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; }
  .recipe-card h3 { margin: 0 0 8px; }
  .recipe-card .meta { color: #666; font-size: 0.9em; margin-bottom: 8px; }
  #recipeStatus { color: #666; margin-top: 12px; }
  #recipeError { color: #c0392b; margin-top: 12px; }
  #recipeRaw { white-space: pre-wrap; background: #f5f5f5; padding: 8px; }
  #authSection { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 20px; }
  #authSection input { margin-right: 6px; }
  #authStatus { color: #666; margin-top: 8px; }
  #authError { color: #c0392b; margin-top: 8px; }
  .recipe-card button.save-btn { margin-top: 8px; }
  #savedError { color: #c0392b; margin-top: 8px; }
</style>
</head>
<body>

<div id="authSection">
  <div id="loggedOutView">
    <input type="email" id="authEmail" placeholder="이메일">
    <input type="password" id="authPassword" placeholder="비밀번호">
    <input type="text" id="authNickname" placeholder="닉네임(회원가입 시)">
    <button id="signupBtn" type="button">회원가입</button>
    <button id="loginBtn" type="button">로그인</button>
  </div>
  <div id="loggedInView" style="display:none;">
    <span id="authNicknameDisplay"></span>님 환영합니다.
    <button id="logoutBtn" type="button">로그아웃</button>
  </div>
  <div id="authStatus"></div>
  <div id="authError"></div>
</div>

<h1>냉장고 사진으로 재료 인식하기</h1>
<input type="file" id="imageInput" accept="image/png, image/jpeg">
<button id="analyzeBtn">인식하기</button>

<div id="status"></div>
<div id="error"></div>

<ul id="ingredients"></ul>
<button id="addBtn" type="button">재료 추가</button>

<h2>레시피 추천</h2>
<button id="recipeBtn" type="button">레시피 추천받기</button>
<div id="recipeStatus"></div>
<div id="recipeError"></div>
<div id="recipeRaw" style="display:none;"></div>
<div id="recipes"></div>

<h2>내 레시피함</h2>
<div id="savedError"></div>
<div id="savedRecipes"></div>

<script>
const authEmail = document.getElementById("authEmail");
const authPassword = document.getElementById("authPassword");
const authNickname = document.getElementById("authNickname");
const signupBtn = document.getElementById("signupBtn");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const loggedOutView = document.getElementById("loggedOutView");
const loggedInView = document.getElementById("loggedInView");
const authNicknameDisplay = document.getElementById("authNicknameDisplay");
const authStatusEl = document.getElementById("authStatus");
const authErrorEl = document.getElementById("authError");
const savedErrorEl = document.getElementById("savedError");
const savedRecipesEl = document.getElementById("savedRecipes");

function setLoggedIn(nickname) {
  loggedOutView.style.display = "none";
  loggedInView.style.display = "block";
  authNicknameDisplay.textContent = nickname;
}

function setLoggedOut() {
  loggedOutView.style.display = "block";
  loggedInView.style.display = "none";
  savedRecipesEl.innerHTML = "";
}

async function refreshAuthState() {
  const res = await fetch("/api/auth/me");
  const data = await res.json();
  if (data.loggedIn) {
    setLoggedIn(data.nickname);
    loadSavedRecipes();
  } else {
    setLoggedOut();
  }
}

async function handleAuth(url) {
  authErrorEl.textContent = "";
  authStatusEl.textContent = "";
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: authEmail.value.trim(),
        password: authPassword.value,
        nickname: authNickname.value.trim(),
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      authErrorEl.textContent = data.error || "요청에 실패했습니다.";
      return;
    }
    setLoggedIn(data.nickname);
    loadSavedRecipes();
  } catch (err) {
    authErrorEl.textContent = "서버 요청 중 오류가 발생했습니다.";
  }
}

signupBtn.onclick = () => handleAuth("/api/auth/signup");
loginBtn.onclick = () => handleAuth("/api/auth/login");
logoutBtn.onclick = async () => {
  await fetch("/api/auth/logout", { method: "POST" });
  setLoggedOut();
};

function renderSavedRecipe(recipe) {
  const card = document.createElement("div");
  card.className = "recipe-card";

  const title = document.createElement("h3");
  title.textContent = recipe.title || "제목 없음";
  card.appendChild(title);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `조리시간: ${recipe.cook_time_minutes ?? "?"}분 | 난이도: ${recipe.difficulty ?? "?"}`;
  card.appendChild(meta);

  const deleteBtn = document.createElement("button");
  deleteBtn.type = "button";
  deleteBtn.textContent = "삭제";
  deleteBtn.onclick = async () => {
    const res = await fetch(`/api/recipes/saved/${recipe.id}`, { method: "DELETE" });
    if (res.ok) {
      card.remove();
    } else {
      const data = await res.json().catch(() => ({}));
      savedErrorEl.textContent = data.error || "삭제에 실패했습니다.";
    }
  };
  card.appendChild(deleteBtn);

  savedRecipesEl.appendChild(card);
}

async function loadSavedRecipes() {
  savedErrorEl.textContent = "";
  savedRecipesEl.innerHTML = "";
  const res = await fetch("/api/recipes/saved");
  if (!res.ok) {
    return;
  }
  const data = await res.json();
  data.recipes.forEach(renderSavedRecipe);
}

refreshAuthState();

const imageInput = document.getElementById("imageInput");
const analyzeBtn = document.getElementById("analyzeBtn");
const addBtn = document.getElementById("addBtn");
const list = document.getElementById("ingredients");
const statusEl = document.getElementById("status");
const errorEl = document.getElementById("error");

function addItem(text) {
  const li = document.createElement("li");
  const input = document.createElement("input");
  input.value = text;
  const removeBtn = document.createElement("button");
  removeBtn.textContent = "삭제";
  removeBtn.type = "button";
  removeBtn.onclick = () => li.remove();
  li.appendChild(input);
  li.appendChild(removeBtn);
  list.appendChild(li);
}

addBtn.onclick = () => addItem("");

analyzeBtn.onclick = async () => {
  errorEl.textContent = "";
  statusEl.textContent = "";
  const file = imageInput.files[0];
  if (!file) {
    errorEl.textContent = "이미지를 먼저 선택해주세요.";
    return;
  }

  statusEl.textContent = "인식 중...";
  list.innerHTML = "";

  const formData = new FormData();
  formData.append("image", file);

  try {
    const res = await fetch("/api/analyze-image", { method: "POST", body: formData });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = "";
      errorEl.textContent = data.error || "인식에 실패했습니다.";
      return;
    }
    data.ingredients.forEach(addItem);
    statusEl.textContent = `${data.ingredients.length}개 재료를 인식했습니다.`;
  } catch (err) {
    statusEl.textContent = "";
    errorEl.textContent = "서버 요청 중 오류가 발생했습니다.";
  }
};

const recipeBtn = document.getElementById("recipeBtn");
const recipeStatusEl = document.getElementById("recipeStatus");
const recipeErrorEl = document.getElementById("recipeError");
const recipeRawEl = document.getElementById("recipeRaw");
const recipesEl = document.getElementById("recipes");

function renderRecipe(recipe) {
  const card = document.createElement("div");
  card.className = "recipe-card";

  const title = document.createElement("h3");
  title.textContent = recipe.title || "제목 없음";
  card.appendChild(title);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `조리시간: ${recipe.cookTimeMinutes ?? "?"}분 | 난이도: ${recipe.difficulty ?? "?"}`;
  card.appendChild(meta);

  const used = document.createElement("div");
  used.textContent = "사용 재료: " + (recipe.usedIngredients || []).join(", ");
  card.appendChild(used);

  const extra = document.createElement("div");
  extra.textContent = "추가 필요 재료: " + ((recipe.extraIngredients || []).join(", ") || "없음");
  card.appendChild(extra);

  const stepsTitle = document.createElement("div");
  stepsTitle.textContent = "조리 순서:";
  card.appendChild(stepsTitle);

  const stepsList = document.createElement("ol");
  (recipe.steps || []).forEach((step) => {
    const li = document.createElement("li");
    li.textContent = step;
    stepsList.appendChild(li);
  });
  card.appendChild(stepsList);

  const saveBtn = document.createElement("button");
  saveBtn.type = "button";
  saveBtn.className = "save-btn";
  saveBtn.textContent = "저장";
  saveBtn.onclick = async () => {
    const res = await fetch("/api/recipes/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(recipe),
    });
    if (res.ok) {
      saveBtn.textContent = "저장됨";
      saveBtn.disabled = true;
      loadSavedRecipes();
    } else {
      const data = await res.json().catch(() => ({}));
      alert(data.error || "저장에 실패했습니다. 로그인이 필요할 수 있습니다.");
    }
  };
  card.appendChild(saveBtn);

  recipesEl.appendChild(card);
}

recipeBtn.onclick = async () => {
  recipeErrorEl.textContent = "";
  recipeStatusEl.textContent = "";
  recipeRawEl.style.display = "none";
  recipesEl.innerHTML = "";

  const ingredients = Array.from(list.querySelectorAll("input"))
    .map((input) => input.value.trim())
    .filter(Boolean);

  if (ingredients.length === 0) {
    recipeErrorEl.textContent = "재료가 없습니다. 먼저 재료를 인식하거나 추가해주세요.";
    return;
  }

  recipeStatusEl.textContent = "레시피 생성 중...";

  try {
    const res = await fetch("/api/generate-recipes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ingredients }),
    });
    const data = await res.json();
    if (!res.ok) {
      recipeErrorEl.textContent = data.error || "레시피 생성에 실패했습니다.";
      recipeStatusEl.textContent = "";
      return;
    }

    if (data.recipes && data.recipes.length > 0) {
      data.recipes.forEach(renderRecipe);
      recipeStatusEl.textContent = `${data.recipes.length}개 레시피를 생성했습니다.`;
    } else if (data.raw) {
      recipeRawEl.style.display = "block";
      recipeRawEl.textContent = data.raw;
      recipeStatusEl.textContent = "구조화된 응답 파싱에 실패해 원문을 표시합니다.";
    } else {
      recipeStatusEl.textContent = "생성된 레시피가 없습니다.";
    }
  } catch (err) {
    recipeErrorEl.textContent = "서버 요청 중 오류가 발생했습니다.";
    recipeStatusEl.textContent = "";
  }
};
</script>
</body>
</html>
